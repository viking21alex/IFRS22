<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual of accounting IFRS 2022</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.0/dist/umd/index.min.js"></script>
<style>
  :root {
    --bg: #f3f5f9;
    --panel: #ffffff;
    --sidebar-bg: #f8fafc;
    --border: #e5e7eb;
    --text: #1e293b;
    --text-soft: #475569;
    --muted: #64748b;
    --accent: #3b82f6;
    --accent-dark: #2563eb;
    --accent-soft: #eff6ff;
    --zh-accent: #10b981;
    --zh-dark: #059669;
    --zh-soft: #ecfdf5;
    --sync-bg: #fef9c3;
    --sync-border: #eab308;
    --highlight: #fde047;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.1);
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--bg);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* 顶部导航 */
  header {
    height: 54px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
    flex-shrink: 0; z-index: 20; box-shadow: var(--shadow-sm);
  }
  .brand {
    font-weight: 700; font-size: 15px; white-space: nowrap; color: var(--text);
    display: flex; align-items: center; gap: 8px; cursor: pointer;
  }
  .brand-badge {
    background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff;
    font-size: 11px; padding: 2px 7px; border-radius: 5px; font-weight: 600;
  }

  .btn {
    padding: 6px 12px; border: 1px solid var(--border); background: var(--panel);
    border-radius: 8px; font-size: 12.5px; font-weight: 500; cursor: pointer;
    white-space: nowrap; color: var(--text-soft); transition: all .15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .btn:hover { background: #f1f5f9; color: var(--text); border-color: #cbd5e1; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-dark); }
  .btn.active-toggle {
    background: var(--accent-soft); color: var(--accent-dark);
    border-color: #93c5fd; font-weight: 600;
  }
  .header-actions { margin-left: auto; display: flex; gap: 8px; }

  /* 主体布局 */
  .main { flex: 1; display: flex; overflow: hidden; position: relative; }

  /* 左侧目录 */
  aside {
    width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0; transition: width .22s ease;
  }
  aside.collapsed { width: 0; overflow: hidden; border-right: none; }
  .aside-filter { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .aside-filter input {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 7px; font-size: 12.5px; outline: none; background: #f8fafc;
  }
  .aside-filter input:focus { background: #fff; border-color: var(--accent); }
  .catalog-list { flex: 1; overflow-y: auto; padding: 8px; }

  .chap-group { margin-bottom: 4px; }
  .chap-header {
    padding: 8px 10px; border-radius: 7px; font-size: 13px; font-weight: 500;
    cursor: pointer; line-height: 1.4; color: var(--text);
    display: flex; align-items: flex-start; gap: 6px; transition: .15s;
  }
  .chap-header:hover { background: #e2e8f066; }
  .chap-header.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
  .chap-arrow {
    font-size: 10px; color: var(--muted); margin-top: 3px;
    transition: transform .18s; flex-shrink: 0; width: 14px; text-align: center;
  }
  .chap-group.expanded .chap-arrow { transform: rotate(90deg); color: var(--accent); }

  .sub-list {
    display: none; padding-left: 14px; margin: 3px 0 6px 8px;
    border-left: 1.5px solid #e2e8f0;
  }
  .chap-group.expanded .sub-list { display: block; }
  .sub-item {
    padding: 6px 10px; border-radius: 6px; font-size: 12.5px; color: var(--text-soft);
    cursor: pointer; line-height: 1.4; margin-bottom: 2px; transition: .15s;
  }
  .sub-item:hover { background: #e2e8f055; color: var(--text); }
  .sub-item.active {
    background: #fff; color: var(--accent-dark); font-weight: 600;
    box-shadow: var(--shadow-sm); border-left: 3px solid var(--accent); padding-left: 7px;
  }

  /* 双栏工作区（每栏顶部自带对称搜索框） */
  .workspace { flex: 1; display: flex; overflow: hidden; padding: 12px; gap: 12px; position: relative; }
  .pane-col {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border-radius: var(--radius);
    border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  #right-col { background: #fcfdff; }
  #right-col.hidden { display: none; }

  .pane-search-bar {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: #f8fafc; flex-shrink: 0;
  }
  .search-box {
    display: flex; align-items: center; gap: 6px;
    background: #ffffff; border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 5px 4px 10px; transition: .18s;
  }
  .search-box.en:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
  .search-box.zh:focus-within { border-color: var(--zh-accent); box-shadow: 0 0 0 3px rgba(16,185,129,0.12); }
  .s-tag {
    font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
  }
  .s-tag.en { background: var(--accent-soft); color: var(--accent-dark); }
  .s-tag.zh { background: var(--zh-soft); color: var(--zh-dark); }
  .search-box input {
    flex: 1; min-width: 80px; border: none; background: transparent;
    font-size: 13px; outline: none; color: var(--text); padding: 4px;
  }
  .s-btn {
    border: none; background: #e2e8f0; color: var(--text); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .s-btn:hover { background: #cbd5e1; }
  .s-btn.ai-en { background: var(--accent); color: #fff; }
  .s-btn.ai-en:hover { background: var(--accent-dark); }
  .s-btn.ai-zh { background: var(--zh-accent); color: #fff; }
  .s-btn.ai-zh:hover { background: var(--zh-dark); }

  .pane-scroll {
    flex: 1; overflow-y: auto; padding: 22px 30px 60px;
  }

  .pane-bar {
    font-size: 12px; color: var(--muted); margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px; border-bottom: 1px solid #f1f5f9;
  }
  .lang-pill {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent-dark);
  }
  .lang-pill.zh { background: var(--zh-soft); color: var(--zh-dark); }

  /* Markdown 排版 */
  .md-body { max-width: 780px; margin: 0 auto; line-height: 1.78; font-size: 14.5px; color: #263244; }
  .md-body h1 { font-size: 21px; margin: 0 0 16px; color: #0f172a; line-height: 1.35; }
  .md-body h2 { font-size: 18.5px; margin: 0 0 14px; color: #0f172a; padding-bottom: 8px; border-bottom: 2px solid #f1f5f9; }
  .md-body h3 { font-size: 15.5px; margin: 20px 0 10px; color: #1e293b; }
  .md-body h4 { font-size: 14.5px; margin: 14px 0 8px; color: #334155; }
  .md-body p, .md-body li { margin-bottom: 10px; }
  .md-body ul, .md-body ol { padding-left: 22px; margin-bottom: 12px; }
  .md-body a { color: var(--accent-dark); text-decoration: none; border-bottom: 1px solid transparent; }
  .md-body a:hover { border-bottom-color: var(--accent-dark); }
  .md-body img { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); margin: 10px 0; }
  .md-body blockquote {
    border-left: 3px solid var(--accent); background: #f8fafc;
    padding: 10px 14px; margin: 12px 0; border-radius: 0 6px 6px 0; color: var(--text-soft);
  }
  .md-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; display: block; overflow-x: auto; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
  .md-body th { background: #f8fafc; font-weight: 600; }

  /* 关键词高亮标记 */
  mark.kw-hl {
    background: #fef08a; color: #854d0e; font-weight: 600;
    padding: 0 2px; border-radius: 3px;
  }

  /* 双方悬浮联动高亮 */
  .sync-block {
    border-radius: 6px; padding: 3px 8px; margin-left: -8px; margin-right: -8px;
    border-left: 3px solid transparent;
    transition: background-color 0.12s ease, border-color 0.12s ease; cursor: pointer;
  }
  .sync-block.sync-hover {
    background-color: var(--sync-bg) !important;
    border-left-color: var(--sync-border) !important;
  }

  @keyframes flashHighlight {
    0% { background: var(--highlight); }
    70% { background: var(--highlight); }
    100% { background: transparent; }
  }
  .anchor-flash { animation: flashHighlight 2.6s ease-out; border-radius: 6px; }

  /* 底部翻页 */
  .page-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--border); gap: 12px;
  }
  .nav-card {
    flex: 1; max-width: 48%; padding: 11px 14px; border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; transition: .15s; background: #f8fafc;
  }
  .nav-card:hover { border-color: var(--accent); background: var(--accent-soft); }
  .nav-card.next { text-align: right; margin-left: auto; }
  .nav-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .nav-title { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 快速搜索结果浮层 */
  .search-modal {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    width: 720px; max-width: 94vw; max-height: 76vh; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-md);
    display: none; flex-direction: column; z-index: 50;
  }
  .search-modal.open { display: flex; }
  .search-modal-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--text-soft); font-weight: 500;
  }
  .search-results { overflow-y: auto; padding: 8px; flex: 1; }
  .search-modal-foot {
    padding: 10px 16px; border-top: 1px solid var(--border); background: #f8fafc;
    border-radius: 0 0 12px 12px; display: none; justify-content: center;
  }
  .search-modal-foot.show { display: flex; }

  /* 独立全屏搜索结果页 */
  .full-search-page {
    position: absolute; inset: 12px; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-md); display: none; flex-direction: column; z-index: 60;
  }
  .full-search-page.open { display: flex; }
  .fsp-header {
    padding: 14px 22px; border-bottom: 1px solid var(--border); background: #f8fafc;
    border-radius: var(--radius) var(--radius) 0 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .fsp-title { font-size: 14.5px; font-weight: 600; color: var(--text); }
  .fsp-list { flex: 1; overflow-y: auto; padding: 16px 24px 40px; max-width: 1040px; width: 100%; margin: 0 auto; }

  .sr-item { padding: 12px 14px; border-radius: 8px; cursor: pointer; border-bottom: 1px solid #f1f5f9; transition: .12s; }
  .sr-item:hover { background: var(--accent-soft); }
  .sr-item.zh-item:hover { background: var(--zh-soft); }
  .sr-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .sr-num { font-size: 11px; color: var(--muted); min-width: 22px; }
  .sr-chap { font-size: 13px; font-weight: 600; color: var(--accent-dark); }
  .sr-item.zh-item .sr-chap { color: var(--zh-dark); }
  .sr-lang { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-dark); font-weight: 600; }
  .sr-lang.zh { background: var(--zh-soft); color: var(--zh-dark); }
  .sr-text { font-size: 13.5px; color: var(--text); line-height: 1.6; }

  /* 设置弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(15,23,42,0.45); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-mask.open { display: flex; }
  .modal-box { background: var(--panel); width: 430px; max-width: 92vw; border-radius: 12px; padding: 22px; box-shadow: var(--shadow-md); }
  .modal-box h3 { font-size: 16px; margin-bottom: 16px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .field input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; outline: none; }
  .field input:focus { border-color: var(--accent); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
</style>
</head>
<body>

<header>
  <button class="btn" onclick="toggleSidebar()">☰ 目录</button>
  <div class="brand" onclick="closeFullSearch(); navigateTo('05.md', 0)">
    <span>Manual of accounting IFRS 2022</span>
    <span class="brand-badge">中英双栏</span>
  </div>
  <div class="header-actions">
    <button class="btn active-toggle" id="sync-scroll-btn" onclick="toggleSyncScroll()">🔗 同步滚动</button>
    <button class="btn" onclick="toggleRightPane()">双栏开关</button>
    <button class="btn" onclick="openSettings()">⚙️ API</button>
  </div>
</header>

<div class="main">
  <aside id="sidebar">
    <div class="aside-filter">
      <input id="cat-filter" type="text" placeholder="筛选章节 (如 IFRS 15, Leases)..." oninput="renderCatalog()">
    </div>
    <div class="catalog-list" id="catalog-list"></div>
  </aside>

  <div class="workspace">
    <!-- 左栏：英文搜索 + 英文原文 -->
    <div class="pane-col" id="left-col">
      <div class="pane-search-bar">
        <div class="search-box en">
          <span class="s-tag en">EN</span>
          <input id="search-en" type="text" placeholder="英文原文搜索 (如 leaseback, fair value)..." onkeydown="if(event.key==='Enter') runSearch('en')">
          <button class="s-btn" onclick="runSearch('en')">搜索</button>
          <button class="s-btn ai-en" onclick="runAISearch('en')" title="AI 英文语义扩词检索">✨ AI</button>
        </div>
      </div>
      <div class="pane-scroll" id="left-pane">
        <div class="md-body" id="md-left">正在加载目录与双语索引...</div>
      </div>
    </div>

    <!-- 右栏：中文搜索 + 中文译文 -->
    <div class="pane-col" id="right-col">
      <div class="pane-search-bar">
        <div class="search-box zh">
          <span class="s-tag zh">中文</span>
          <input id="search-zh" type="text" placeholder="中文译文搜索 (如 售后租回, 公允价值)..." onkeydown="if(event.key==='Enter') runSearch('zh')">
          <button class="s-btn" onclick="runSearch('zh')">搜索</button>
          <button class="s-btn ai-zh" onclick="runAISearch('zh')" title="AI 中文语义扩词检索">✨ AI</button>
        </div>
      </div>
      <div class="pane-scroll" id="right-pane">
        <div class="md-body" id="md-right"></div>
      </div>
    </div>

    <!-- 快速搜索结果浮层 -->
    <div class="search-modal" id="search-modal">
      <div class="search-modal-head">
        <span id="search-status">搜索结果</span>
        <button class="btn" style="padding:4px 10px;" onclick="closeSearch()">关闭</button>
      </div>
      <div class="search-results" id="search-results"></div>
      <div class="search-modal-foot" id="search-modal-foot">
        <button class="btn primary" id="view-all-btn" onclick="openFullSearchPage()">查看全部搜索结果 →</button>
      </div>
    </div>

    <!-- 独立全屏搜索结果页 -->
    <div class="full-search-page" id="full-search-page">
      <div class="fsp-header">
        <div class="fsp-title" id="fsp-title">全部搜索结果</div>
        <button class="btn" onclick="closeFullSearch()">← 返回正文阅读</button>
      </div>
      <div class="fsp-list" id="fsp-list"></div>
    </div>
  </div>
</div>

<!-- API 设置弹窗 -->
<div class="modal-mask" id="settings-modal">
  <div class="modal-box">
    <h3>API 设置（仅用于 ✨ AI 语义搜索，本地存储）</h3>
    <div class="field">
      <label>API Base URL（兼容 OpenAI 格式）</label>
      <input id="cfg-url" placeholder="https://api.deepseek.com/v1">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="cfg-key" type="password" placeholder="sk-...">
    </div>
    <div class="field">
      <label>模型名称</label>
      <input id="cfg-model" placeholder="deepseek-chat">
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
let catalog = [];
let enSearch = null;
let zhSearch = null;
let currentFile = '';
let currentSecIdx = 0;
let syncScrollEnabled = true;
let pauseSyncScroll = false;
let pendingLocate = null;
let currentSync = { L: [], R: [], l2r: [], r2l: [] };
let lastSearchState = { results: [], lang: 'en', query: '', title: '' };

const enCache = new Map();
const zhCache = new Map();
const expandedFiles = new Set();

function getConfig() {
  return {
    url: localStorage.getItem('ifrs_api_url') || 'https://api.deepseek.com/v1',
    key: localStorage.getItem('ifrs_api_key') || '',
    model: localStorage.getItem('ifrs_api_model') || 'deepseek-chat'
  };
}
function openSettings() {
  const c = getConfig();
  document.getElementById('cfg-url').value = c.url;
  document.getElementById('cfg-key').value = c.key;
  document.getElementById('cfg-model').value = c.model;
  document.getElementById('settings-modal').classList.add('open');
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }
function saveSettings() {
  localStorage.setItem('ifrs_api_url', document.getElementById('cfg-url').value.trim().replace(/\/$/, ''));
  localStorage.setItem('ifrs_api_key', document.getElementById('cfg-key').value.trim());
  localStorage.setItem('ifrs_api_model', document.getElementById('cfg-model').value.trim());
  closeSettings();
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
function toggleRightPane() { document.getElementById('right-col').classList.toggle('hidden'); }
function closeSearch() { document.getElementById('search-modal').classList.remove('open'); }
function closeFullSearch() { document.getElementById('full-search-page').classList.remove('open'); }

function toggleSyncScroll() {
  syncScrollEnabled = !syncScrollEnabled;
  const btn = document.getElementById('sync-scroll-btn');
  btn.classList.toggle('active-toggle', syncScrollEnabled);
  btn.textContent = syncScrollEnabled ? '🔗 同步滚动' : '🔓 独立滚动';
}

function temporarilyPauseSyncScroll(ms = 600) {
  pauseSyncScroll = true;
  clearTimeout(window._pauseSyncTimer);
  window._pauseSyncTimer = setTimeout(() => { pauseSyncScroll = false; }, ms);
}

// 左右双向同步滚动
(function initSyncScroll() {
  const leftPane = document.getElementById('left-pane');
  const rightPane = document.getElementById('right-pane');
  let activeDriver = null;
  let clearTimer = null;

  const sync = (source, target, driverName) => {
    if (!syncScrollEnabled || pauseSyncScroll) return;
    if (activeDriver && activeDriver !== driverName) return;
    activeDriver = driverName;
    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => { activeDriver = null; }, 80);

    const maxSource = source.scrollHeight - source.clientHeight;
    const maxTarget = target.scrollHeight - target.clientHeight;
    if (maxSource > 0 && maxTarget > 0) {
      target.scrollTop = (source.scrollTop / maxSource) * maxTarget;
    }
  };

  leftPane.addEventListener('scroll', () => sync(leftPane, rightPane, 'left'), { passive: true });
  rightPane.addEventListener('scroll', () => sync(rightPane, leftPane, 'right'), { passive: true });
})();

function enTokenize(text) {
  return String(text || '').toLowerCase().match(/[a-z0-9]+(?:\.[0-9]+)*/g) || [];
}

function zhTokenize(text) {
  const tokens = [];
  const lower = String(text || '').toLowerCase();
  const alnum = lower.match(/[a-z0-9]+(?:\.[0-9]+)*/g);
  if (alnum) tokens.push(...alnum);
  const zhSeqs = lower.match(/[\u4e00-\u9fff]+/g);
  if (zhSeqs) {
    for (const seq of zhSeqs) {
      if (seq.length === 1) tokens.push(seq);
      else for (let i = 0; i < seq.length - 1; i++) tokens.push(seq.slice(i, i + 2));
    }
  }
  return tokens;
}

async function init() {
  try {
    const catRes = await fetch('catalog.json');
    catalog = await catRes.json();
    renderCatalog();

    window.addEventListener('hashchange', handleHash);
    if (location.hash) handleHash();
    else navigateTo('07.md', 0);

    fetch('search-index.json').then(r => r.json()).then(docs => {
      const enDocs = docs.filter(d => d.lang === 'en');
      const zhDocs = docs.filter(d => d.lang === 'zh');

      enSearch = new MiniSearch({
        fields: ['text', 'chapter'],
        storeFields: ['file', 'sec', 'lang', 'chapter', 'anchor', 'text'],
        tokenize: enTokenize,
        searchOptions: { tokenize: enTokenize, fuzzy: 0.2, prefix: true }
      });
      enSearch.addAll(enDocs);

      zhSearch = new MiniSearch({
        fields: ['text', 'chapter'],
        storeFields: ['file', 'sec', 'lang', 'chapter', 'anchor', 'text'],
        tokenize: zhTokenize,
        searchOptions: { tokenize: zhTokenize, prefix: true }
      });
      zhSearch.addAll(zhDocs);
    });
  } catch (e) {
    document.getElementById('md-left').innerHTML =
      `<p style="color:#dc2626">加载失败：请确认已运行 <code>python build_index.py</code>，并通过 <code>python -m http.server 8000</code> 打开。</p>`;
  }
}

function parseMarkdownToSections(mdText, fallbackTitle) {
  const temp = document.createElement('div');
  temp.innerHTML = marked.parse(mdText);

  const sections = [];
  const anchorMap = new Map();
  const nodes = Array.from(temp.childNodes);

  let curTitle = '📑 本章目录概览';
  let curNodes = [];
  let pendingAnchors = [];

  const isAnchorOnly = (node) => {
    if (node.nodeType !== 1) return false;
    if (node.tagName === 'A' && node.id && !node.textContent.trim()) return true;
    if (node.tagName === 'P' && !node.textContent.trim() && node.querySelector('a[id]')) return true;
    return false;
  };

  const flushSection = () => {
    if (!curNodes.length) return;
    const wrap = document.createElement('div');
    curNodes.forEach(n => wrap.appendChild(n));
    const idx = sections.length;
    wrap.querySelectorAll('[id]').forEach(el => anchorMap.set(el.id, idx));
    sections.push({ title: curTitle, html: wrap.innerHTML });
  };

  for (const node of nodes) {
    if (node.nodeType === 3 && !node.textContent.trim()) continue;
    if (node.nodeType === 1 && node.tagName === 'P' && node.textContent.trim() === '返回目录') continue;
    if (isAnchorOnly(node)) { pendingAnchors.push(node); continue; }

    if (node.nodeType === 1 && node.tagName === 'H2') {
      flushSection();
      curTitle = node.textContent.trim();
      curNodes = [...pendingAnchors, node];
      pendingAnchors = [];
    } else {
      if (pendingAnchors.length) { curNodes.push(...pendingAnchors); pendingAnchors = []; }
      curNodes.push(node);
    }
  }
  if (pendingAnchors.length) curNodes.push(...pendingAnchors);
  flushSection();

  if (!sections.length) sections.push({ title: fallbackTitle, html: temp.innerHTML });
  return { title: fallbackTitle, sections, anchorMap };
}

async function loadChapterPair(file) {
  const catItem = catalog.find(c => c.file === file);
  const title = catItem ? catItem.title : file;

  if (!enCache.has(file)) {
    const res = await fetch(file);
    enCache.set(file, parseMarkdownToSections(await res.text(), title));
  }
  if (!zhCache.has(file)) {
    try {
      const resZh = await fetch(`MDCN/${file}`);
      if (resZh.ok) zhCache.set(file, parseMarkdownToSections(await resZh.text(), title));
      else zhCache.set(file, null);
    } catch {
      zhCache.set(file, null);
    }
  }
  return { en: enCache.get(file), zh: zhCache.get(file) };
}

function renderCatalog() {
  const kw = document.getElementById('cat-filter').value.trim().toLowerCase();
  const list = document.getElementById('catalog-list');
  const filtered = catalog.filter(c => c.title.toLowerCase().includes(kw) || c.file.includes(kw));

  list.innerHTML = filtered.map(c => {
    const isExpanded = expandedFiles.has(c.file);
    const isCurrentChap = c.file === currentFile;
    const cached = enCache.get(c.file);
    let subHtml = '';
    if (isExpanded && cached) {
      subHtml = `<div class="sub-list">` + cached.sections.map((s, idx) => `
        <div class="sub-item ${isCurrentChap && idx === currentSecIdx ? 'active' : ''}"
             onclick="closeFullSearch(); navigateTo('${c.file}', ${idx})">${escapeHtml(s.title)}</div>
      `).join('') + `</div>`;
    } else if (isExpanded) {
      subHtml = `<div class="sub-list"><div class="sub-item" style="color:var(--muted)">加载小节目录...</div></div>`;
    }

    return `
      <div class="chap-group ${isExpanded ? 'expanded' : ''}">
        <div class="chap-header ${isCurrentChap ? 'active' : ''}" onclick="toggleChapter('${c.file}')">
          <span class="chap-arrow">▶</span>
          <span>${escapeHtml(c.title)}</span>
        </div>
        ${subHtml}
      </div>
    `;
  }).join('');
}

async function toggleChapter(file) {
  closeFullSearch();
  if (expandedFiles.has(file)) {
    expandedFiles.delete(file);
    renderCatalog();
  } else {
    expandedFiles.add(file);
    renderCatalog();
    await loadChapterPair(file);
    renderCatalog();
    if (file !== currentFile) navigateTo(file, 0);
  }
}

function navigateTo(file, target = 0) {
  const hash = typeof target === 'number'
    ? `#${file}@${target}`
    : (target ? `#${file}#${target}` : `#${file}@0`);
  if (location.hash === hash) handleHash();
  else location.hash = hash;
}

async function handleHash() {
  const raw = location.hash.slice(1);
  if (!raw) return;

  let file = '', secIdx = 0, anchor = '';
  if (raw.includes('#')) {
    [file, anchor] = raw.split('#');
  } else if (raw.includes('@')) {
    const parts = raw.split('@');
    file = parts[0];
    secIdx = parseInt(parts[1], 10) || 0;
  } else {
    file = raw;
  }
  if (!file || !file.endsWith('.md')) return;

  const { en, zh } = await loadChapterPair(file);
  if (anchor && en.anchorMap.has(anchor)) secIdx = en.anchorMap.get(anchor);
  else if (anchor && zh && zh.anchorMap.has(anchor)) secIdx = zh.anchorMap.get(anchor);
  if (secIdx < 0 || secIdx >= en.sections.length) secIdx = 0;

  currentFile = file;
  currentSecIdx = secIdx;
  expandedFiles.add(file);
  renderCatalog();
  renderDualSection(en, zh, secIdx, anchor);
}

function renderDualSection(en, zh, secIdx, anchor = '') {
  const enSec = en.sections[secIdx];
  const zhSec = (zh && zh.sections[secIdx]) ? zh.sections[secIdx] : null;

  const prevSec = secIdx > 0 ? en.sections[secIdx - 1] : null;
  const nextSec = secIdx < en.sections.length - 1 ? en.sections[secIdx + 1] : null;
  const navHtml = `
    <div class="page-nav">
      ${prevSec ? `<div class="nav-card" onclick="navigateTo('${currentFile}', ${secIdx - 1})"><div class="nav-label">← 上一节</div><div class="nav-title">${escapeHtml(prevSec.title)}</div></div>` : '<div></div>'}
      ${nextSec ? `<div class="nav-card next" onclick="navigateTo('${currentFile}', ${secIdx + 1})"><div class="nav-label">下一节 →</div><div class="nav-title">${escapeHtml(nextSec.title)}</div></div>` : ''}
    </div>
  `;

  document.getElementById('md-left').innerHTML = `
    <div class="pane-bar">
      <div><span class="lang-pill">English 原文</span> &nbsp;${escapeHtml(en.title)}</div>
      <span>${secIdx + 1} / ${en.sections.length}</span>
    </div>
    <div id="left-body">${enSec.html}</div>
    ${navHtml}
  `;

  document.getElementById('md-right').innerHTML = `
    <div class="pane-bar">
      <div><span class="lang-pill zh">中文译文 (MDCN)</span> &nbsp;${zhSec ? escapeHtml(zhSec.title) : ''}</div>
      <span style="font-size:11.5px;">锚点智能对齐 · 点击定位</span>
    </div>
    <div id="right-body">${zhSec ? zhSec.html : '<p style="color:var(--muted);padding:30px 0;">未找到对应的 MDCN 中文小节内容。</p>'}</div>
  `;

  temporarilyPauseSyncScroll(300);
  document.getElementById('left-pane').scrollTop = 0;
  document.getElementById('right-pane').scrollTop = 0;

  bindSmartSyncHighlighting();

  if (pendingLocate) {
    const loc = pendingLocate;
    pendingLocate = null;
    setTimeout(() => locateDualPosition(loc), 80);
  } else if (anchor) {
    setTimeout(() => locateDualPosition({ lang: 'en', anchor, snippet: '', query: '' }), 80);
  }
}

function locateDualPosition({ lang, anchor, snippet, query }) {
  const { L, R, l2r, r2l } = currentSync;
  const srcList = lang === 'zh' ? R : L;
  const dstList = lang === 'zh' ? L : R;
  const mapArr = lang === 'zh' ? r2l : l2r;
  const rootId = lang === 'zh' ? 'right-body' : 'left-body';

  let foundIdx = -1;
  if (snippet) {
    const key = snippet.replace(/\s+/g, ' ').trim().slice(0, 28).toLowerCase();
    if (key.length >= 6) {
      foundIdx = srcList.findIndex(el => el.innerText.replace(/\s+/g, ' ').toLowerCase().includes(key));
    }
  }
  if (foundIdx === -1 && anchor) {
    const anchorEl = document.querySelector(`#${rootId} [id="${CSS.escape(anchor)}"]`);
    if (anchorEl) {
      const block = anchorEl.closest('.sync-block') || anchorEl.nextElementSibling?.closest('.sync-block') || anchorEl.parentElement?.closest('.sync-block');
      if (block) foundIdx = srcList.indexOf(block);
    }
  }
  if (foundIdx === -1) return;

  const srcEl = srcList[foundIdx];
  const dstEl = dstList[mapArr[foundIdx]];

  // 在命中的正文段落里高亮搜索词
  if (query && srcEl) highlightInDomElement(srcEl, query);

  temporarilyPauseSyncScroll(900);
  const flash = (el) => {
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('anchor-flash');
    void el.offsetWidth;
    el.classList.add('anchor-flash');
  };
  flash(srcEl);
  flash(dstEl);
}

// 在 DOM 文本节点中安全高亮关键词（不破坏原有链接/标签）
function highlightInDomElement(rootEl, query) {
  const terms = String(query || '').trim().split(/\s+/).filter(t => t.length >= 2);
  if (!terms.length) return;
  const pattern = new RegExp(`(${terms.map(escapeRegExp).join('|')})`, 'gi');
  const walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  let node;
  while ((node = walker.nextNode())) {
    if (node.parentElement && node.parentElement.tagName !== 'MARK' && pattern.test(node.nodeValue)) {
      textNodes.push(node);
    }
  }
  textNodes.forEach(tn => {
    const span = document.createElement('span');
    span.innerHTML = escapeHtml(tn.nodeValue).replace(pattern, '<mark class="kw-hl">$1</mark>');
    tn.replaceWith(span);
  });
}

function getBlockSyncKeys(el) {
  const keys = [];
  const aWithId = el.querySelector('a[id]');
  if (aWithId && aWithId.id) keys.push('id:' + aWithId.id);
  const prev = el.previousElementSibling;
  if (prev && prev.tagName === 'A' && prev.id) keys.push('id:' + prev.id);

  const txt = el.innerText.trim();
  const numMatch = txt.match(/^(?:FAQ\s*|EX\s*)?(\d+\.\d+(?:\.\d+)*)\b/i);
  if (numMatch) keys.push('num:' + numMatch[0].toLowerCase().replace(/\s+/g, ''));
  return keys;
}

function bindSmartSyncHighlighting() {
  const getCleanBlocks = (rootId) => {
    const raw = Array.from(document.querySelectorAll(`#${rootId} h1, #${rootId} h2, #${rootId} h3, #${rootId} h4, #${rootId} p, #${rootId} li, #${rootId} tr`));
    return raw.filter(el => {
      if (!el.innerText.trim()) return false;
      if (el.tagName === 'P' && el.closest('li, td, th')) return false;
      if (el.tagName === 'LI' && el.closest('td, th')) return false;
      return true;
    });
  };

  const L = getCleanBlocks('left-body');
  const R = getCleanBlocks('right-body');
  currentSync = { L, R, l2r: [], r2l: [] };
  if (!L.length || !R.length) return;

  L.forEach(el => el.classList.add('sync-block'));
  R.forEach(el => el.classList.add('sync-block'));

  const rightKeyMap = new Map();
  R.forEach((el, ri) => {
    for (const k of getBlockSyncKeys(el)) {
      if (!rightKeyMap.has(k)) rightKeyMap.set(k, []);
      rightKeyMap.get(k).push(ri);
    }
  });

  const anchors = [[0, 0]];
  let lastR = 0;
  L.forEach((el, li) => {
    if (li === 0) return;
    for (const k of getBlockSyncKeys(el)) {
      const candidates = rightKeyMap.get(k);
      if (!candidates) continue;
      const matchR = candidates.find(ri => ri > lastR);
      if (matchR !== undefined) {
        anchors.push([li, matchR]);
        lastR = matchR;
        break;
      }
    }
  });
  if (anchors[anchors.length - 1][0] !== L.length - 1 || anchors[anchors.length - 1][1] !== R.length - 1) {
    anchors.push([L.length - 1, R.length - 1]);
  }

  const l2r = new Array(L.length).fill(0);
  const r2l = new Array(R.length).fill(0);
  for (let a = 0; a < anchors.length - 1; a++) {
    const [l1, r1] = anchors[a];
    const [l2, r2] = anchors[a + 1];
    const dl = Math.max(1, l2 - l1);
    const dr = Math.max(1, r2 - r1);
    for (let li = l1; li <= l2; li++) l2r[li] = Math.min(R.length - 1, Math.round(r1 + ((li - l1) / dl) * (r2 - r1)));
    for (let ri = r1; ri <= r2; ri++) r2l[ri] = Math.min(L.length - 1, Math.round(l1 + ((ri - r1) / dr) * (l2 - l1)));
  }

  currentSync = { L, R, l2r, r2l };

  const bindSide = (srcList, dstList, mapArr) => {
    srcList.forEach((el, i) => {
      el.addEventListener('mouseenter', (e) => {
        e.stopPropagation();
        el.classList.add('sync-hover');
        const partner = dstList[mapArr[i]];
        if (partner) partner.classList.add('sync-hover');
      });
      el.addEventListener('mouseleave', (e) => {
        e.stopPropagation();
        el.classList.remove('sync-hover');
        const partner = dstList[mapArr[i]];
        if (partner) partner.classList.remove('sync-hover');
      });
      el.addEventListener('click', (e) => {
        if (e.target.closest('a[href]')) return;
        e.stopPropagation();
        const partner = dstList[mapArr[i]];
        if (partner) {
          temporarilyPauseSyncScroll(700);
          partner.scrollIntoView({ behavior: 'smooth', block: 'center' });
          partner.classList.remove('anchor-flash');
          void partner.offsetWidth;
          partner.classList.add('anchor-flash');
        }
      });
    });
  };

  bindSide(L, R, l2r);
  bindSide(R, L, r2l);
}

['md-left', 'md-right'].forEach(id => {
  document.getElementById(id).addEventListener('click', (e) => {
    const a = e.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || href.startsWith('http://') || href.startsWith('https://')) return;

    e.preventDefault();
    if (href === 'README.md') { navigateTo('05.md', 0); return; }
    const [targetFile, targetAnchor] = href.split('#');
    if (targetFile && targetFile.endsWith('.md')) navigateTo(targetFile, targetAnchor || 0);
    else if (targetAnchor) navigateTo(currentFile, targetAnchor);
  });
});

// 搜索词高亮渲染（用于标题和正文摘要）
function highlightText(text, query) {
  const safe = escapeHtml(text);
  const terms = String(query || '').trim().split(/\s+/).filter(t => t.length >= 1);
  if (!terms.length) return safe;
  // 按长度降序匹配，优先高亮长词组
  terms.sort((a, b) => b.length - a.length);
  const re = new RegExp(`(${terms.map(escapeRegExp).join('|')})`, 'gi');
  return safe.replace(re, '<mark class="kw-hl">$1</mark>');
}

function buildResultItemHtml(r, idx, lang, query, showIndex = false) {
  const titleHtml = highlightText(r.chapter, query);
  const bodyHtml = highlightText(r.text.slice(0, 220), query);
  return `
    <div class="sr-item ${lang === 'zh' ? 'zh-item' : ''}" onclick="jumpToSearchResult(${idx})">
      <div class="sr-head">
        ${showIndex ? `<span class="sr-num">#${idx + 1}</span>` : ''}
        <span class="sr-lang ${lang === 'zh' ? 'zh' : ''}">${lang === 'zh' ? '中文' : 'EN'}</span>
        <span class="sr-chap">${titleHtml}</span>
      </div>
      <div class="sr-text">${bodyHtml}...</div>
    </div>
  `;
}

// 独立英文 / 中文离线搜索
function runSearch(lang, customQuery = null, customLabel = '') {
  const engine = lang === 'zh' ? zhSearch : enSearch;
  if (!engine) { alert('索引仍在后台加载，请稍等 1 秒重试'); return; }

  const inputEl = document.getElementById(lang === 'zh' ? 'search-zh' : 'search-en');
  const q = (customQuery ?? inputEl.value).trim();
  if (!q) return;

  let results = engine.search(q, { combineWith: 'AND' });
  let modeText = '精准匹配';
  if (!results.length) {
    results = engine.search(q, { combineWith: 'OR' });
    modeText = '模糊匹配';
  }
  const langName = lang === 'zh' ? '中文译文' : '英文原文';
  const title = customLabel || `[${langName} · ${modeText}] "${q}"，共命中 ${results.length} 条`;
  showSearchResults(results, lang, q, title);
}

// 独立 AI 语义扩词搜索
async function runAISearch(lang) {
  const inputEl = document.getElementById(lang === 'zh' ? 'search-zh' : 'search-en');
  const q = inputEl.value.trim();
  if (!q) return;
  const cfg = getConfig();
  if (!cfg.key) { openSettings(); alert('AI 语义搜索需要先填写 API Key'); return; }

  document.getElementById('search-modal').classList.add('open');
  document.getElementById('search-modal-foot').classList.remove('show');
  document.getElementById('search-status').textContent = `AI 正在提炼 IFRS ${lang === 'zh' ? '中文' : '英文'}专业检索词...`;
  document.getElementById('search-results').innerHTML = '';

  const prompt = lang === 'zh'
    ? '你是 IFRS 检索助手。根据用户的会计问题，只输出 2 到 4 个最核心的 IFRS 中文专业会计术语（用空格分隔），不要输出英文、标点、解释或序号。'
    : '你是 IFRS 检索助手。根据用户的会计问题，只输出 2 到 4 个最核心的 IFRS 英文专业会计术语（用空格分隔），不要输出中文、标点、解释或序号。';

  try {
    const res = await fetch(`${cfg.url}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cfg.key}` },
      body: JSON.stringify({
        model: cfg.model,
        messages: [{ role: 'system', content: prompt }, { role: 'user', content: q }],
        temperature: 0.1
      })
    });
    const data = await res.json();
    const expanded = data.choices?.[0]?.message?.content?.trim() || q;
    runSearch(lang, expanded, `AI 语义扩词 [${expanded}]，共命中结果：`);
  } catch (err) {
    document.getElementById('search-status').textContent = 'AI 语义搜索失败：' + err.message;
  }
}

function showSearchResults(results, lang, query, title) {
  lastSearchState = { results, lang, query, title };
  document.getElementById('search-modal').classList.add('open');
  document.getElementById('search-status').textContent = title;
  const box = document.getElementById('search-results');
  const foot = document.getElementById('search-modal-foot');

  if (!results.length) {
    box.innerHTML = '<div style="padding:30px;text-align:center;color:var(--muted)">未找到匹配段落</div>';
    foot.classList.remove('show');
    return;
  }

  const previewLimit = 15;
  const slice = results.slice(0, previewLimit);
  box.innerHTML = slice.map((r, idx) => buildResultItemHtml(r, idx, lang, query, false)).join('');

  if (results.length > previewLimit) {
    document.getElementById('view-all-btn').textContent = `查看全部搜索结果（共 ${results.length} 条）→`;
    foot.classList.add('show');
  } else {
    foot.classList.remove('show');
  }
}

// 独立页面显示全部搜索结果
function openFullSearchPage() {
  closeSearch();
  const { results, lang, query, title } = lastSearchState;
  document.getElementById('fsp-title').textContent = title;
  const listEl = document.getElementById('fsp-list');
  // 最多渲染前 500 条保证流畅
  const cap = results.slice(0, 500);
  listEl.innerHTML = cap.map((r, idx) => buildResultItemHtml(r, idx, lang, query, true)).join('');
  if (results.length > 500) {
    listEl.innerHTML += `<div style="text-align:center;color:var(--muted);padding:16px;font-size:12.5px;">已展示前 500 条（共 ${results.length} 条），建议增加关键词缩小范围</div>`;
  }
  document.getElementById('full-search-page').classList.add('open');
  listEl.scrollTop = 0;
}

function jumpToSearchResult(idx) {
  const r = lastSearchState.results[idx];
  if (!r) return;
  closeSearch();
  closeFullSearch();
  pendingLocate = {
    lang: r.lang,
    anchor: r.anchor || '',
    snippet: r.text || '',
    query: lastSearchState.query
  };
  const target = r.anchor ? r.anchor : (r.sec || 0);
  navigateTo(r.file, target);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

init();
